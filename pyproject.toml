[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "samce"
version = "0.0.1"
description = "a tiny, beautiful, no-config text editor."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mukund Jha" }]
keywords = ["terminal", "text-editor", "tui", "cli", "minimal"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Text Editors",
]
dependencies = []

[project.optional-dependencies]
full = ["pygments>=2.17", "wcwidth>=0.2"]
dev = ["pytest>=8", "ruff>=0.5", "build", "twine"]

[project.urls]
Homepage = "https://github.com/mukundzha/samce"
Issues = "https://github.com/mukundzha/samce/issues"

[project.scripts]
samce = "samce.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
